services:
  locust:
    image: locustio/locust:2.32.0
    container_name: opswatch-locust
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8089:8089"
      - "5557:5557"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py:ro
    environment:
      TARGET_HOST: ${TARGET_HOST:-http://host.docker.internal:3001}
    command:
      - -f
      - /mnt/locust/locustfile.py
      - --host
      - ${TARGET_HOST:-http://host.docker.internal:3001}
      - --web-host
      - "0.0.0.0"
