apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: opswatch
  labels:
    app: frontend
    app.kubernetes.io/name: opswatch
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
